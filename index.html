<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#8ec5ff"
    />
    <title>RummyTimer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="favicon.svg"
    />
    <link
      rel="manifest"
      href="manifest.json"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #8ec5ff;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        position: fixed;
        inset: 0;
      }

      .navbar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
        background: rgba(15, 23, 42, 0.35);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        color: #fff;
      }

      .navbar-brand {
        font-size: 1.25rem;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(15, 23, 42, 0.45);
      }

      .navbar-menu {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        margin-left: auto;
        padding: 0;
        border: 0;
        border-radius: 0.5rem;
        background: transparent;
        cursor: pointer;
      }

      .navbar-menu:active {
        background: rgba(255, 255, 255, 0.18);
      }

      .stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .pie {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        transform: scale(1.5);
      }

      .pie path.is-active {
        filter: brightness(1.2) saturate(1.15);
        cursor: pointer;
      }

      .pie path:not(.is-active) {
        filter: brightness(0.65) saturate(0.8);
      }

      .pie line {
        stroke: rgba(255, 255, 255, 0.65);
        stroke-width: 1.5px;
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }

      .face {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 10;
        width: min(34vmin, 12rem);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
      }

      .face-ring {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .face-ring circle {
        fill: none;
        stroke-width: 3;
      }

      .face-ring-track {
        stroke: #dbdcdf;
      }

      .face-ring-progress {
        stroke: #05df72;
        stroke-linecap: round;
        transition: stroke 0.3s ease;
      }

      .face-disc {
        position: absolute;
        inset: 4.5%;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.3);
      }

      .face-time {
        font-size: clamp(1.75rem, 14vmin, 3.5rem);
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: #0f172a;
      }

      .face.is-expired .face-disc {
        background: #fee2e2;
        animation: face-pulse 1s ease-in-out infinite;
      }

      .face.is-expired .face-time {
        color: #b91c1c;
      }

      @keyframes face-pulse {
        50% {
          transform: scale(1.04);
        }
      }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(15, 23, 42, 0.45);
      }

      .scrim[hidden] {
        display: none;
      }

      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: min(80vw, 20rem);
        padding: calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
        overflow-y: auto;
        background: #eff6ff;
        box-shadow: 8px 0 30px rgba(15, 23, 42, 0.25);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      .sidebar.is-open {
        transform: translateX(0);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }

      .sidebar-title {
        margin: 0;
        font-size: 1.125rem;
      }

      .sidebar-close {
        display: grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: 0;
        border-radius: 0.5rem;
        background: transparent;
        color: #0f172a;
        cursor: pointer;
      }

      .sidebar-close:active {
        background: rgba(15, 23, 42, 0.1);
      }

      .field {
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
      }

      .control {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: 1px solid #bfdbfe;
        border-radius: 0.5rem;
        background: #fff;
        color: #0f172a;
        font: inherit;
      }

      .sidebar-reset {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2b7fff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
    <script
      src="main.js"
      type="module"
    ></script>
  </head>
  <body>
    <div class="app">
      <nav class="navbar">
        <img
          class="navbar-logo"
          src="favicon.svg"
          alt=""
          width="40"
          height="40"
        />
        <span class="navbar-brand">RummyTimer</span>
        <button
          class="navbar-menu"
          id="menu-button"
          type="button"
          aria-label="Settings"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <img
            src="hamburger.svg"
            alt=""
            width="24"
            height="24"
          />
        </button>
      </nav>

      <main class="stage">
        <svg
          class="pie"
          id="pie"
          viewBox="0 0 100 100"
          preserveAspectRatio="xMidYMid slice"
        ></svg>

        <div
          class="face"
          id="face"
        >
          <svg
            class="face-ring"
            viewBox="0 0 100 100"
            aria-hidden="true"
          >
            <circle
              class="face-ring-track"
              cx="50"
              cy="50"
              r="45"
            ></circle>
            <circle
              class="face-ring-progress"
              id="face-ring"
              cx="50"
              cy="50"
              r="45"
            ></circle>
          </svg>
          <div class="face-disc">
            <span
              class="face-time"
              id="face-time"
              >30</span
            >
          </div>
        </div>
      </main>

      <div
        class="scrim"
        id="scrim"
        hidden
      ></div>

      <aside
        class="sidebar"
        id="sidebar"
        aria-label="Settings"
        aria-hidden="true"
      >
        <div class="sidebar-header">
          <h2 class="sidebar-title">Settings</h2>
          <button
            class="sidebar-close"
            id="close-button"
            type="button"
            aria-label="Close settings"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 18 17.94 6M18 18 6.06 6"></path>
            </svg>
          </button>
        </div>

        <label
          class="field"
          for="player-count"
          >Number of players</label
        >
        <select
          class="control"
          id="player-count"
        >
          <option value="2">2</option>
          <option
            value="3"
            selected
          >
            3
          </option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>

        <label
          class="field"
          for="turn-duration"
          >Turn length</label
        >
        <select
          class="control"
          id="turn-duration"
        >
          <option value="15000">15 seconds</option>
          <option
            value="30000"
            selected
          >
            30 seconds
          </option>
          <option value="45000">45 seconds</option>
          <option value="60000">1 minute</option>
          <option value="120000">2 minutes</option>
        </select>

        <button
          class="sidebar-reset"
          id="reset-button"
          type="button"
        >
          Reset game
        </button>
      </aside>
    </div>
  </body>
</html>
