<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--four coloured background-->
  <path d="M50 50 L50 0 A50 50 0 0 1 100 50 Z" fill="#fb2c36" />
  <path d="M50 50 L100 50 A50 50 0 0 1 50 100 Z" fill="#2b7fff" />
  <path d="M50 50 L50 100 A50 50 0 0 1 0 50 Z" fill="#05df72" />
  <path d="M50 50 L0 50 A50 50 0 0 1 50 0 Z" fill="#ffdf20" />
  <!--circle outline-->
  <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="4" />
  <!--timer hand-->
  <line
    x1="50"
    y1="50"
    x2="50"
    y2="22"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
  />
  <!--center dot-->
  <circle cx="50" cy="50" r="3" fill="white" />
  <!--timer knob-->
  <rect x="42" y="2" width="16" height="8" rx="2" fill="white" />
</svg>
